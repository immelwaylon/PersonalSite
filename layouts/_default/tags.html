{{ define "main" }}
<div class="max-w-prose mx-auto">
  <header class="mb-12">
    <h1 class="text-4xl font-extrabold text-neutral-900 dark:text-neutral">
      {{ .Title }}
    </h1>
    {{ with .Params.description }}
    <p class="mt-3 text-lg text-neutral-500 dark:text-neutral-400">
      {{ . }}
    </p>
    {{ end }}
  </header>

  <style>
  /* Force tags to display one per line */
  .tags-container > article {
    flex: 0 0 100% !important;
    max-width: 100% !important;
    margin-bottom: 1rem;
  }

  /* Improve spacing and appearance */
  .tags-container {
    margin-left: 0;
    margin-right: 0;
  }

  .tags-container > article h2 {
    margin-bottom: 0;
  }
  </style>

  <section class="tags-container flex flex-wrap max-w-prose -mx-2 overflow-hidden">
    {{ range .Data.Terms.ByCount }}
    <article class="w-full px-2 my-3 overflow-hidden">
      <h2 class="flex items-center">
        <a class="text-xl font-medium decoration-primary-500 hover:underline hover:underline-offset-2" href="{{ .Page.RelPermalink }}">
          {{ .Page.Title }}
        </a>
        <span class="px-2 text-base text-primary-500">·</span>
        <span class="text-base text-neutral-400">{{ .Count }}</span>
      </h2>
    </article>
    {{ end }}
  </section>
</div>
{{ end }}
